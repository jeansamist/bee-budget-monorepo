# Local development services. Start with `docker compose up -d`.
services:
  bee_budget_database:
    image: postgres:17
    container_name: bee_budget_database
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: bee_budget
    ports:
      - "5434:5432" # host 5434: 5432/5433 are taken by other local projects
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d bee_budget"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - bee_budget_network

  # Catches every email sent by the API (verification codes, password resets).
  # Inbox UI: http://localhost:8025
  bee_budget_mailpit:
    image: axllent/mailpit:latest
    container_name: bee_budget_mailpit
    environment:
      # The API always authenticates to SMTP, so accept any credentials locally.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - bee_budget_network

volumes:
  postgres_data:

networks:
  bee_budget_network:
